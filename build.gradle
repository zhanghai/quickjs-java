import com.vanniktech.maven.publish.SonatypeHost
import net.ltgt.gradle.errorprone.CheckSeverity

buildscript {
  repositories {
    mavenCentral()
    google()
    gradlePluginPortal()
  }
  dependencies {
    classpath 'com.android.tools.build:gradle:8.10.0'
    classpath 'net.ltgt.gradle:gradle-errorprone-plugin:4.2.0'
    classpath 'com.vanniktech:gradle-maven-publish-plugin:0.32.0'
  }
}

ext {
  buildToolsVersion = '36.0.0'
  compileSdk = 36
  ndkVersion = '28.1.13356709'
  minSdk = 21
  targetSdk = 36
  ndkAbiFilters = ['x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a']

  deps = [
      'androidx': [
          'annotation': 'androidx.annotation:annotation:1.9.1',
          'test': [
              'runner': 'androidx.test:runner:1.6.2',
          ],
      ],
      'duktape': 'com.squareup.duktape:duktape-android:1.4.0',
      'junit': 'junit:junit:4.13.2',
      'truth': 'com.google.truth:truth:1.4.4',
      'okio': 'com.squareup.okio:okio:1.17.6',
  ]
}

subprojects {
  repositories {
    mavenCentral()
    google()
    jcenter {
      // Required for a dependency of Android lint.
      content {
        includeGroup 'org.jetbrains.trove4j'
      }
    }
  }

  plugins.withId('com.android.library') {
    android.lintOptions {
      textReport true
      textOutput 'stdout'
      lintConfig rootProject.file('lint.xml')

      checkDependencies true
      checkTestSources false // TODO true https://issuetracker.google.com/issues/138247523
      explainIssues false

      // We run a full lint analysis as build part in CI, so skip vital checks for assemble task.
      checkReleaseBuilds false
    }
  }

  if (System.env.JITPACK != "true") {
    plugins.withId('com.vanniktech.maven.publish') {
      mavenPublishing {
        publishToMavenCentral(SonatypeHost.DEFAULT)
        signAllPublications()
      }
      signing {
        def signingKey = findProperty('signingKey')
        def signingPassword = ''
        useInMemoryPgpKeys(signingKey, signingPassword)
      }
    }
  }

  tasks.withType(Test).configureEach {
    testLogging {
      if (System.getenv('CI') == 'true') {
        events = ['failed', 'skipped', 'passed']
      }
      exceptionFormat 'full'
    }
  }

  apply plugin: 'net.ltgt.errorprone'

  dependencies {
    errorproneJavac 'com.google.errorprone:javac:9+181-r4173-1'
    errorprone 'com.google.errorprone:error_prone_core:2.38.0'
  }

  tasks.withType(JavaCompile).configureEach {
    options.errorprone {
      check('MissingFail', CheckSeverity.ERROR)
      check('MissingOverride', CheckSeverity.ERROR)
      check('UnsafeFinalization', CheckSeverity.ERROR)
      check('UnusedException', CheckSeverity.ERROR)
      check('UnusedMethod', CheckSeverity.ERROR)
      check('UnusedNestedClass', CheckSeverity.ERROR)
      check('UnusedVariable', CheckSeverity.ERROR)
    }
  }
}
